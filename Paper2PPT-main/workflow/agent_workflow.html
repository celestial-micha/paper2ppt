<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paper2PPT Architecture</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-color: #ffffff;
        --line-color: #cbd5e1;
        --text-primary: #1e293b;
        --text-secondary: #64748b;
        
        /* Modern AI Paper Palette */
        --accent-blue: #3b82f6;   /* Agents */
        --accent-green: #10b981;  /* Process/Success */
        --accent-orange: #f59e0b; /* Data/Artifacts */
        --accent-red: #ef4444;    /* Error/Loop */
        
        --card-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
        --card-radius: 8px;
    }

    body {
        font-family: 'Inter', sans-serif;
        background-color: #f8fafc;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        color: var(--text-primary);
    }

    .pipeline-container {
        display: flex;
        align-items: center;
        gap: 30px;
        position: relative;
        padding: 40px;
        background: white;
        border-radius: 16px;
        box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.05);
    }

    /* Groups */
    .stage-group {
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
        z-index: 2;
    }

    .stage-label {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: var(--text-secondary);
        font-weight: 700;
        margin-bottom: 12px;
    }

    .stage-group .node {
        margin-bottom: 50px;
    }

    .stage-group .node:last-child {
        margin-bottom: 0;
    }

    /* Nodes */
    .node {
        width: 140px;
        padding: 12px;
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: var(--card-radius);
        box-shadow: var(--card-shadow);
        text-align: center;
        position: relative;
        transition: transform 0.2s, box-shadow 0.2s;
    }

    .node:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
    }

    .node-icon {
        font-size: 18px;
        margin-bottom: 6px;
        display: block;
    }

    .node-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-primary);
        display: block;
        margin-bottom: 2px;
    }

    .node-desc {
        font-size: 10px;
        color: var(--text-secondary);
        line-height: 1.3;
        display: block;
    }

    /* Node Types */
    .type-agent { border-top: 3px solid var(--accent-blue); }
    .type-data { border-top: 3px solid var(--accent-orange); }
    .type-process { border-top: 3px solid var(--accent-green); }

    /* Refinement Loop Box */
    .loop-box {
        border: 2px dashed var(--line-color);
        background: #f8fafc;
        border-radius: 12px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 50px;
        position: relative;
    }

    .loop-label-box {
        position: absolute;
        top: -10px;
        left: 16px;
        background: #f8fafc;
        padding: 0 8px;
        font-size: 10px;
        font-weight: 700;
        color: var(--text-secondary);
        text-transform: uppercase;
    }

    .loop-row {
        display: flex;
        align-items: center;
        gap: 30px;
    }

    /* Decision Diamond */
    .decision {
        width: 30px;
        height: 30px;
        background: white;
        border: 2px solid var(--text-secondary);
        transform: rotate(45deg);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 10px;
        box-shadow: var(--card-shadow);
    }
    .decision span {
        transform: rotate(-45deg);
        font-size: 14px;
        font-weight: bold;
        color: var(--text-secondary);
    }

    /* SVG Layer */
    svg.connections {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
        overflow: visible;
    }

    path {
        fill: none;
        stroke: var(--line-color);
        stroke-width: 2;
        stroke-linejoin: round;
        stroke-linecap: round;
    }

    .arrow-head {
        fill: var(--line-color);
    }
</style>
</head>
<body>

<div class="pipeline-container">
    
    <!-- Stage 1: Input -->
    <div class="stage-group">
        <div class="stage-label">Input</div>
        <div class="node type-data" id="n-input">
            <span class="node-icon">📄</span>
            <span class="node-title">Paper</span>
            <span class="node-desc">PDF / LaTeX</span>
        </div>
        <div class="node type-process" id="n-ingest">
            <span class="node-icon">⚙️</span>
            <span class="node-title">Ingestion</span>
            <span class="node-desc">MinerU / Loader</span>
        </div>
    </div>

    <!-- Stage 2: Planning -->
    <div class="stage-group">
        <div class="stage-label">Reasoning</div>
        <div class="node type-agent" id="n-planner">
            <span class="node-icon">🧠</span>
            <span class="node-title">Planner</span>
            <span class="node-desc">Design Structure</span>
        </div>
        <div class="node type-agent" id="n-generator">
            <span class="node-icon">✍️</span>
            <span class="node-title">Generator</span>
            <span class="node-desc">Write LaTeX Code</span>
        </div>
    </div>

    <!-- Stage 3: Refinement Loop -->
    <div class="loop-box" id="loop-box">
        <div class="loop-label-box">Self-Correction Loop</div>
        
        <div class="loop-row">
            <div class="node type-process" id="n-compiler">
                <span class="node-icon">🔨</span>
                <span class="node-title">Compiler</span>
                <span class="node-desc">Build PDF</span>
            </div>
            <div class="decision" id="n-check"><span>?</span></div>
        </div>

        <div class="loop-row" style="justify-content: center;">
            <div class="node type-agent" id="n-refiner" style="border-color: var(--accent-red);">
                <span class="node-icon">🔧</span>
                <span class="node-title">Refiner</span>
                <span class="node-desc">Fix Overflows</span>
            </div>
        </div>
    </div>

    <!-- Stage 4: Output -->
    <div class="stage-group">
        <div class="stage-label">Result</div>
        <div class="node type-data" id="n-output" style="border-color: var(--accent-green); background: #f0fdf4;">
            <span class="node-icon">✨</span>
            <span class="node-title">Final PPT</span>
            <span class="node-desc">PDF Presentation</span>
        </div>
    </div>

    <svg class="connections">
        <defs>
            <!-- Standard Arrow -->
            <marker id="arrow" viewBox="0 0 10 10" refX="0" refY="5"
                markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#cbd5e1" />
            </marker>
            
            <!-- Red Arrow (Error) -->
            <marker id="arrow-red" viewBox="0 0 10 10" refX="0" refY="5"
                markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444" />
            </marker>
            
            <!-- Green Arrow (Success) -->
            <marker id="arrow-green" viewBox="0 0 10 10" refX="0" refY="5"
                markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981" />
            </marker>
        </defs>
    </svg>
</div>

<script>
    function connect(id1, id2, color=null, dashed=false, label=null) {
        const el1 = document.getElementById(id1);
        const el2 = document.getElementById(id2);
        const svg = document.querySelector('.connections');
        const container = document.querySelector('.pipeline-container').getBoundingClientRect();
        
        const r1 = el1.getBoundingClientRect();
        const r2 = el2.getBoundingClientRect();

        // Coordinates relative to container
        const x1 = r1.right - container.left;
        const y1 = r1.top + r1.height/2 - container.top;
        
        // Target is Left Edge. Shorten by arrow length (10px) + padding (2px) = 12px
        const arrowLen = 12; 
        const x2 = r2.left - container.left - arrowLen;
        const y2 = r2.top + r2.height/2 - container.top;

        // Bezier Curve
        const cp1x = x1 + (x2 - x1) / 2;
        const cp2x = x2 - (x2 - x1) / 2;
        
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", `M ${x1} ${y1} C ${cp1x} ${y1}, ${cp2x} ${y2}, ${x2} ${y2}`);
        
        let markerUrl = "url(#arrow)";
        if (color === '#ef4444') markerUrl = "url(#arrow-red)";
        if (color === '#10b981') markerUrl = "url(#arrow-green)";
        
        path.setAttribute("marker-end", markerUrl);
        
        if (color) path.setAttribute("stroke", color);
        if (dashed) path.setAttribute("stroke-dasharray", "4,4");
        
        svg.appendChild(path);

        if (label) {
            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            text.setAttribute("x", (x1+x2)/2);
            text.setAttribute("y", (y1+y2)/2 - 5);
            text.textContent = label;
            text.setAttribute("fill", color || "#64748b");
            text.setAttribute("font-size", "10px");
            text.setAttribute("font-weight", "bold");
            text.setAttribute("text-anchor", "middle");
            text.setAttribute("paint-order", "stroke");
            text.setAttribute("stroke", "white");
            text.setAttribute("stroke-width", "3px");
            svg.appendChild(text);
        }
    }

    function connectVertical(id1, id2, color=null, label=null) {
        // For Refiner loop specifically
        const el1 = document.getElementById(id1);
        const el2 = document.getElementById(id2);
        const svg = document.querySelector('.connections');
        const container = document.querySelector('.pipeline-container').getBoundingClientRect();
        
        const r1 = el1.getBoundingClientRect();
        const r2 = el2.getBoundingClientRect();

        // Bottom of 1 to Top of 2
        const x1 = r1.left + r1.width/2 - container.left;
        const y1 = r1.bottom - container.top;
        
        // Target is Top Edge. Shorten by arrow length.
        const arrowLen = 12;
        const x2 = r2.left + r2.width/2 - container.left;
        const y2 = r2.top - container.top - arrowLen;

        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        // Simple curve
        path.setAttribute("d", `M ${x1} ${y1} C ${x1} ${y1+30}, ${x2} ${y2-30}, ${x2} ${y2}`);
        
        let markerUrl = "url(#arrow)";
        if (color === '#ef4444') markerUrl = "url(#arrow-red)";
        
        path.setAttribute("marker-end", markerUrl);
        if (color) path.setAttribute("stroke", color);
        
        svg.appendChild(path);
        
        if (label) {
            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            text.setAttribute("x", (x1 + x2) / 2 + 10);
            text.setAttribute("y", (y1+y2)/2);
            text.textContent = label;
            text.setAttribute("fill", color || "#64748b");
            text.setAttribute("font-size", "10px");
            text.setAttribute("font-weight", "bold");
            text.setAttribute("paint-order", "stroke");
            text.setAttribute("stroke", "white");
            text.setAttribute("stroke-width", "3px");
            svg.appendChild(text);
        }
    }
    
    function connectBack(id1, id2) {
        // Refiner -> Compiler (Backwards)
        const el1 = document.getElementById(id1);
        const el2 = document.getElementById(id2);
        const svg = document.querySelector('.connections');
        const container = document.querySelector('.pipeline-container').getBoundingClientRect();
        
        const r1 = el1.getBoundingClientRect();
        const r2 = el2.getBoundingClientRect();

        const x1 = r1.left - container.left;
        const y1 = r1.top + r1.height/2 - container.top;
        
        // Target is Bottom Edge. Shorten by arrow length.
        const arrowLen = 12;
        const x2 = r2.left + r2.width/2 - container.left; // Bottom of compiler
        const y2 = r2.bottom - container.top + arrowLen;

        // Path: Left from Refiner, Curve Up, Enter Compiler from Bottom
        
        const cp1x = x1 - 40;
        const cp1y = y1;
        
        const cp2x = x2;
        const cp2y = y2 + 40;

        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", `M ${x1} ${y1} C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${x2} ${y2}`);
        path.setAttribute("marker-end", "url(#arrow)");
        path.setAttribute("stroke-dasharray", "4,4");
        
        svg.appendChild(path);
    }

    function draw() {
        const svg = document.querySelector('.connections');
        while (svg.firstChild) {
            if (svg.firstChild.tagName !== 'defs') svg.removeChild(svg.firstChild);
            else break;
        }

        // Main Flow
        // 1. Input -> Ingestion (Vertical within Stage 1)
        connectVertical('n-input', 'n-ingest');
        
        // 2. Ingestion -> Planner (Stage 1 -> Stage 2)
        connect('n-ingest', 'n-planner');
        
        // 3. Planner -> Generator (Vertical within Stage 2)
        connectVertical('n-planner', 'n-generator');
        
        // 4. Generator -> Compiler (Stage 2 -> Stage 3)
        connect('n-generator', 'n-compiler');
        
        // Loop Internals
        connect('n-compiler', 'n-check');
        
        // Check -> Output (Success)
        connect('n-check', 'n-output', '#10b981', false, 'OK');

        // Check -> Refiner (Fail)
        connectVertical('n-check', 'n-refiner', '#ef4444', 'Overflow');

        // Refiner -> Compiler (Retry)
        connectBack('n-refiner', 'n-compiler');
    }

    window.onload = draw;
    window.onresize = draw;
</script>

</body>
</html>
